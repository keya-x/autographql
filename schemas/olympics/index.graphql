type City {
  city_name: String
  games: [Games] @materializer(query: "gamesViaGames_city")
  id: ID!
}

type Competitor_event {
  competitor_id: ID
  event: Event @materializer(query: "eventUsingCompetitor_event_event_id_fkey")
  event_id: ID
  games_competitor: Games_competitor
    @materializer(
      query: "games_competitorUsingCompetitor_event_competitor_id_fkey"
    )
  medal: Medal @materializer(query: "medalUsingCompetitor_event_medal_id_fkey")
  medal_id: ID
}

type Event {
  competitor_event: [Competitor_event]
    @materializer(query: "competitor_eventUsingCompetitor_event_event_id_fkey")
  event_name: String
  id: ID!
  sport: Sport @materializer(query: "sportUsingEvent_sport_id_fkey")
  sport_id: ID
}

type Games {
  city: [City] @materializer(query: "cityViaGames_city")
  games_competitor: [Games_competitor]
    @materializer(query: "games_competitorUsingGames_competitor_games_id_fkey")
  games_name: String
  games_year: ID
  id: ID!
  season: String
}

type Games_competitor {
  age: ID
  competitor_event: [Competitor_event]
    @materializer(
      query: "competitor_eventUsingCompetitor_event_competitor_id_fkey"
    )
  games: Games @materializer(query: "gamesUsingGames_competitor_games_id_fkey")
  games_id: ID
  id: ID!
  person: Person
    @materializer(query: "personUsingGames_competitor_person_id_fkey")
  person_id: ID
}

type Medal {
  competitor_event: [Competitor_event] @materializer(query: "competitor_event")
  id: ID!
  medal_name: String
}

type Noc_region {
  id: ID!
  noc: String
  person: [Person] @materializer(query: "personViaPerson_region")
  region_name: String
}

type Person {
  full_name: String
  games_competitor: [Games_competitor]
    @materializer(query: "games_competitorUsingGames_competitor_person_id_fkey")
  gender: String
  height: ID
  id: ID!
  noc_region: [Noc_region] @materializer(query: "noc_regionViaPerson_region")
  weight: ID
}

type Sport {
  event: [Event] @materializer(query: "eventUsingEvent_sport_id_fkey")
  id: ID!
  sport_name: String
}


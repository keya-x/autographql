scalar DateTime

type Album {
  albumid: ID!
  artist: Artist @materializer(query: "artistUsingAlbum_artistid_fkey")
  artistid: ID
  title: String
  track: [Track] @materializer(query: "trackUsingTrack_albumid_fkey")
}

type Artist {
  album: [Album] @materializer(query: "albumUsingAlbum_artistid_fkey")
  artistid: ID!
  name: String
}

type Customer {
  address: String
  city: String
  company: String
  country: String
  customerid: ID!
  email: String
  employee: Employee
    @materializer(query: "employeeUsingCustomer_supportrepid_fkey")
  fax: String
  firstname: String
  invoice: [Invoice] @materializer(query: "invoiceUsingInvoice_customerid_fkey")
  lastname: String
  phone: String
  postalcode: String
  state: String
  supportrepid: ID
}

type Employee {
  address: String
  birthdate: DateTime
  city: String
  country: String
  customer: [Customer]
    @materializer(query: "customerUsingCustomer_supportrepid_fkey")
  email: String
  employee: Employee
    @materializer(query: "employeeUsingEmployee_reportsto_fkey")
  employeeUsingEmployee_reportsto_fkey: [Employee]
    @materializer(query: "employeeUsingEmployee_reportsto_fkeyInEmployee")
  employeeid: ID!
  fax: String
  firstname: String
  hiredate: DateTime
  lastname: String
  phone: String
  postalcode: String
  reportsto: ID
  state: String
  title: String
}

type Genre {
  genreid: ID!
  name: String
  track: [Track] @materializer(query: "trackUsingTrack_genreid_fkey")
}

type Invoice {
  billingaddress: String
  billingcity: String
  billingcountry: String
  billingpostalcode: String
  billingstate: String
  customer: Customer
    @materializer(query: "customerUsingInvoice_customerid_fkey")
  customerid: ID
  invoicedate: DateTime
  invoiceid: ID!
  invoiceline: [Invoiceline]
    @materializer(query: "invoicelineUsingInvoiceline_invoiceid_fkey")
  total: Float
}

type Invoiceline {
  invoice: Invoice
    @materializer(query: "invoiceUsingInvoiceline_invoiceid_fkey")
  invoiceid: ID
  invoicelineid: ID!
  quantity: ID
  track: Track @materializer(query: "trackUsingInvoiceline_trackid_fkey")
  trackid: ID
  unitprice: Float
}

type Mediatype {
  mediatypeid: ID!
  name: String
  track: [Track] @materializer(query: "trackUsingTrack_mediatypeid_fkey")
}

type Playlist {
  name: String
  playlistid: ID!
  track: [Track] @materializer(query: "trackViaPlaylisttrack")
}

type Track {
  album: Album @materializer(query: "albumUsingTrack_albumid_fkey")
  albumid: ID
  bytes: ID
  composer: String
  genre: Genre @materializer(query: "genreUsingTrack_genreid_fkey")
  genreid: ID
  invoiceline: [Invoiceline]
    @materializer(query: "invoicelineUsingInvoiceline_trackid_fkey")
  mediatype: Mediatype
    @materializer(query: "mediatypeUsingTrack_mediatypeid_fkey")
  mediatypeid: ID
  milliseconds: ID
  name: String
  playlist: [Playlist] @materializer(query: "playlistViaPlaylisttrack")
  trackid: ID!
  unitprice: Float
}


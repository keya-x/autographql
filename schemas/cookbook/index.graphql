}

type Nutrition {
  alcohol: Float
  calories: Float
  carbo: Float
  cholestrl: Float
  fiber: Float
  iron: Float
  pcnt_cal_carb: Float
  pcnt_cal_fat: Float
  pcnt_cal_prot: Float
  protein: Float
  quantity: [Quantity]
    @materializer(query: "quantityUsingQuantity_recipe_id_fkey")
  recipe: Recipe @materializer(query: "recipeUsingNutrition_recipe_id_fkey")
  recipe_id: ID!
  sat_fat: Float
  sodium: Float
  total_fat: Float
  vitamin_a: Float
  vitamin_c: Float
}

type Quantity {
  ingredient: Ingredient
    @materializer(query: "ingredientUsingQuantity_ingredient_id_fkey")
  ingredient_id: ID
  max_qty: Float
  min_qty: Float
  nutrition: Nutrition
    @materializer(query: "nutritionUsingQuantity_recipe_id_fkey")
  optional: String
  preparation: String
  quantity_id: ID!
  recipe: Recipe @materializer(query: "recipeUsingQuantity_recipe_id_fkey1")
  recipe_id: ID
  unit: String
}

type Recipe {
  cook_min: ID
  directions: String
  intro: String
  nutrition: Nutrition

  quantity: [Quantity]
    @materializer(query: "quantityUsingQuantity_recipe_id_fkey1")
  recipe_id: ID!
  servings: ID
  source: String
  stnd_min: ID
  subtitle: String
  title: String
  yield_unit: String
}


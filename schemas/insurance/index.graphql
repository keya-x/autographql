  updateStaff(staff_id: ID!, staff_details: String): Staff
    @dbquery(
      type: "postgresql"
      schema: "public"
      query: """
      UPDATE "staff" SET
        "staff_details" = COALESCE($2, "staff_details")
      WHERE
        "staff_id" = $1
      RETURNING *
      """
      configuration: "postgresql_config"
    )

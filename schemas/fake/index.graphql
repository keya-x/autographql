    @materializer(
      query: "messaginganalysisUsingMessaginganalysis_msgcntref_fkey"
    )
  moderationaction: [Moderationaction]
    @materializer(query: "moderationactionUsingModerationaction_macntref_fkey")
  postfreq: Float
  postintvar: Float
  postnum: ID
  sessionbehavior: Sessionbehavior
    @materializer(query: "sessionbehaviorUsingContentbehavior_cntsessref_fkey")
  urldomdiv: Float
  urlsharefreq: String
}

type Messaginganalysis {
  contentbehavior: Contentbehavior
    @materializer(query: "contentbehaviorUsingMessaginganalysis_msgcntref_fkey")
  convnatval: Float
  keypatmatch: String
  langsoph: Float
  msgcntref: String
  msgfreq: Float
  msgkey: String!
  msgnetref: String
  msgsimscore: Float
  msgtgtdiv: Float
  networkmetrics: Networkmetrics
    @materializer(query: "networkmetricsUsingMessaginganalysis_msgnetref_fkey")
  resptimepat: String
  sentvar: Float
  technicalinfo: [Technicalinfo]
    @materializer(query: "technicalinfoUsingTechnicalinfo_techmsgref_fkey")

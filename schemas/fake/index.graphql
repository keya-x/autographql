type Account {
  accindex: String!
  acctagespan: ID
  acctcategory: String
  acctcreatedate: String
  acctident: String
  acctstatus: String
  authstatus: String
  platident: String
  plattype: String
  profile: [Profile] @materializer(query: "profileUsingProfile_profaccref_fkey")
}

type Contentbehavior {
  cntdiverseval: Float
  cntlangnum: String
  cntref: String!
  cntsessref: String
  cntsimscore: Float
  cnttopicent: Float
  cntuniqscore: Float
  hashratio: Float
  hashusepat: String

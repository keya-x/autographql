}

type Moderationaction {
  abuserepnum: ID
  actiontaken: String
  appealnum: String
  authenscore: Float
  clustrole: String
  clustsize: ID
  contentbehavior: Contentbehavior
    @materializer(query: "contentbehaviorUsingModerationaction_macntref_fkey")
  coordscore: Float
  credscore: Float
  impactval: Float
  investstatus: String
  lastrevdate: String
  linkacctnum: ID
  macntref: String
  masedetref: String
  modactkey: String!
  monitorpriority: String
  netinflscore: Float
  nextrevdate: String
  reputscore: Float
  reviewfreq: String
  securitydetection: Securitydetection
    @materializer(
      query: "securitydetectionUsingModerationaction_masedetref_fkey"
    )
  susphist: String
  trustval: Float
  violtypedist: String
  warnnum: ID
}

type Networkmetrics {
  messaginganalysis: [Messaginganalysis]
    @materializer(
      query: "messaginganalysisUsingMessaginganalysis_msgnetref_fkey"
    )
  netkey: String!
  netsessref: String
  network_engagement_metrics: String
  technicalinfo: [Technicalinfo]
    @materializer(query: "technicalinfoUsingTechnicalinfo_technetref_fkey")
}

type Profile {
  account: Account @materializer(query: "accountUsingProfile_profaccref_fkey")
  profaccref: String
  profile_composition: String
  profkey: String!
  sessionbehavior: [Sessionbehavior]
    @materializer(query: "sessionbehaviorUsingSessionbehavior_sessprofref_fkey")
}

type Securitydetection {
  detection_score_profile: String
  detectsource: String
  detecttime: String
  lastupd: String

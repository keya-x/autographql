  sectechref: String
  technicalinfo: Technicalinfo
    @materializer(query: "technicalinfoUsingSecuritydetection_sectechref_fkey")
  updfreqhrs: ID
}

type Sessionbehavior {
  actregval: Float
  acttimedist: String
  contentbehavior: [Contentbehavior]

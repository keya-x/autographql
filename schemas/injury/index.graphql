  score: String
  season: Int
  stadium: Stadium @materializer(query: "stadiumUsingGame_stadium_id_fkey")
  stadium_id: Int
}

type Injury_accident {
  game: Game @materializer(query: "gameUsingInjury_accident_game_id_fkey")
  game_id: Int
  id: Int!
  injury: String
  number_of_matches: String
  player: String
  source: String
}

type Stadium {
  average_attendance: Float
  capacity_percentage: Float
  game: [Game] @materializer(query: "gameUsingGame_stadium_id_fkey")
  home_games: Int
  id: Int!
  name: String
  total_attendance: Float
}


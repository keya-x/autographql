type Station {
  city: String
  dock_count: ID
  id: ID!
  installation_date: String
  lat: Float
  long: Float
  name: String
  status: [Status] @materializer(query: "status")
}

type Status {
  bikes_available: ID
  docks_available: ID
  station: Station @materializer(query: "stationUsingStatus_station_id_fkey")
  station_id: ID
  time: String
}

type Trip {
  bike_id: ID
  duration: ID
  end_date: String
  end_station_id: ID
  end_station_name: String
  id: ID!
  start_date: String
  start_station_id: ID
  start_station_name: String
  subscription_type: String
  zip_code: ID
}

type Weather {
  cloud_cover: ID
  date: String
  events: String
  max_dew_point_f: ID
  max_gust_speed_mph: ID
  max_humidity: ID
  max_sea_level_pressure_inches: Float
  max_temperature_f: ID
  max_visibility_miles: ID
  max_wind_speed_mph: ID
  mean_dew_point_f: ID
  mean_humidity: ID
  mean_sea_level_pressure_inches: Float
  mean_temperature_f: ID
  mean_visibility_miles: ID
  mean_wind_speed_mph: ID
  min_dew_point_f: ID
  min_humidity: ID
  min_sea_level_pressure_inches: Float
  min_temperature_f: ID
  min_visibility_miles: ID
  precipitation_inches: ID
  wind_dir_degrees: ID
  zip_code: ID
}

input StringFilter {
  eq: String
  ne: String

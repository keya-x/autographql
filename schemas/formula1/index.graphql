type Circuits {
  alt: String
  circuitid: ID!
  circuitref: String
  country: String
  lat: Float
  lng: Float
  location: String
  name: String
  races: [Races] @materializer(query: "racesUsingRaces_circuitid_fkey")
  url: String
}

type Constructorresults {
  constructorid: ID
  constructorresultsid: ID!
  constructors: Constructors
    @materializer(
      query: "constructorsUsingConstructorresults_constructorid_fkey"
    )
  points: Float
  raceid: ID
  races: Races @materializer(query: "racesUsingConstructorresults_raceid_fkey")
  status: String
}

type Constructors {
  constructorid: ID!
  constructorref: String
  constructorresults: [Constructorresults]
    @materializer(
      query: "constructorresultsUsingConstructorresults_constructorid_fkey"
    )
  constructorstandings: [Constructorstandings]
    @materializer(
      query: "constructorstandingsUsingConstructorstandings_constructorid_fkey"
    )
  name: String
  nationality: String
  qualifying: [Qualifying]
    @materializer(query: "qualifyingUsingQualifying_constructorid_fkey")
  results: [Results]
    @materializer(query: "resultsUsingResults_constructorid_fkey")
  url: String
}

type Constructorstandings {
  constructorid: ID
  constructors: Constructors
    @materializer(
      query: "constructorsUsingConstructorstandings_constructorid_fkey"
    )
  constructorstandingsid: ID!
  points: Float
  position: ID
  positiontext: String
  raceid: ID
  races: Races
    @materializer(query: "racesUsingConstructorstandings_raceid_fkey")
  wins: ID
}

type Drivers {
  code: String
  dob: String
  driverid: ID!
  driverref: String
  driverstandings: [Driverstandings]
    @materializer(query: "driverstandingsUsingDriverstandings_driverid_fkey")
  forename: String
  laptimes: [Laptimes]
    @materializer(query: "laptimesUsingLaptimes_driverid_fkey")
  nationality: String
  number: String
  pitstops: [Pitstops]
    @materializer(query: "pitstopsUsingPitstops_driverid_fkey")
  qualifying: [Qualifying]
    @materializer(query: "qualifyingUsingQualifying_driverid_fkey")
  results: [Results] @materializer(query: "resultsUsingResults_driverid_fkey")
  surname: String
  url: String
}

type Driverstandings {
  driverid: ID
  drivers: Drivers
    @materializer(query: "driversUsingDriverstandings_driverid_fkey")
  driverstandingsid: ID!
  points: Float
  position: ID
  positiontext: String
  raceid: ID
  races: Races @materializer(query: "racesUsingDriverstandings_raceid_fkey")
  wins: ID
}

type Laptimes {
  driverid: ID!
  drivers: Drivers @materializer(query: "driversUsingLaptimes_driverid_fkey")
  lap: ID!
  milliseconds: ID
  position: ID
  raceid: ID!
  races: Races @materializer(query: "racesUsingLaptimes_raceid_fkey")
  time: String
}

type Pitstops {
  driverid: ID!
  drivers: Drivers @materializer(query: "driversUsingPitstops_driverid_fkey")
  duration: String
  lap: ID
  milliseconds: ID
  raceid: ID!
  races: Races @materializer(query: "racesUsingPitstops_raceid_fkey")
  stop: ID!
  time: String
}

type Qualifying {
  constructorid: ID
  constructors: Constructors
    @materializer(query: "constructorsUsingQualifying_constructorid_fkey")
  driverid: ID
  drivers: Drivers @materializer(query: "driversUsingQualifying_driverid_fkey")
  number: ID
  position: ID
  q1: String
  q2: String
  q3: String
  qualifyid: ID!
  raceid: ID
  races: Races @materializer(query: "racesUsingQualifying_raceid_fkey")
}

type Races {
  circuitid: ID
  circuits: Circuits @materializer(query: "circuitsUsingRaces_circuitid_fkey")
  constructorresults: [Constructorresults]
    @materializer(
      query: "constructorresultsUsingConstructorresults_raceid_fkey"
    )
  constructorstandings: [Constructorstandings]
    @materializer(
      query: "constructorstandingsUsingConstructorstandings_raceid_fkey"
    )
  date: String
  driverstandings: [Driverstandings]
    @materializer(query: "driverstandingsUsingDriverstandings_raceid_fkey")
  laptimes: [Laptimes] @materializer(query: "laptimesUsingLaptimes_raceid_fkey")
  name: String
  pitstops: [Pitstops] @materializer(query: "pitstopsUsingPitstops_raceid_fkey")
  qualifying: [Qualifying]
    @materializer(query: "qualifyingUsingQualifying_raceid_fkey")
  raceid: ID!
  results: [Results] @materializer(query: "resultsUsingResults_raceid_fkey")
  round: ID
  time: String
  url: String
  year: ID
}

type Results {
  constructorid: ID
  constructors: Constructors
    @materializer(query: "constructorsUsingResults_constructorid_fkey")
  driverid: ID
  drivers: Drivers @materializer(query: "driversUsingResults_driverid_fkey")

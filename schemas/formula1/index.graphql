  fastestlapspeed: String
  fastestlaptime: String
  grid: ID
  laps: String
  milliseconds: String
  number: ID
  points: Float
  position: String
  positionorder: ID
  positiontext: String
  raceid: ID
  races: Races @materializer(query: "racesUsingResults_raceid_fkey")
  rank: String
  resultid: ID!
  statusid: ID
  time: String
}

type Seasons {
  url: String
  year: ID!
}

type Status {
  status: String
  statusid: ID!
}


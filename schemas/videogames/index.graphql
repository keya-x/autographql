type Game {
  game_name: String
  genre: Genre @materializer(query: "genreUsingGame_genre_id_fkey")
  genre_id: ID
  id: ID!
}

type Game_platform {
  game_publisher: Game_publisher
    @materializer(
      query: "game_publisherUsingGame_platform_game_publisher_id_fkey"
    )
  game_publisher_id: ID
  id: ID!
  platform: Platform
    @materializer(query: "platformUsingGame_platform_platform_id_fkey")
  platform_id: ID
  region_sales: [Region_sales] @materializer(query: "region_sales")
  release_year: ID
}

type Game_publisher {
  game_id: ID
  game_platform: [Game_platform]
    @materializer(
      query: "game_platformUsingGame_platform_game_publisher_id_fkey"
    )
  id: ID!
  publisher: Publisher
    @materializer(query: "publisherUsingGame_publisher_publisher_id_fkey")
  publisher_id: ID
}

type Genre {
  game: [Game] @materializer(query: "gameUsingGame_genre_id_fkey")
  genre_name: String
  id: ID!
}

type Platform {
  game_platform: [Game_platform]
    @materializer(query: "game_platformUsingGame_platform_platform_id_fkey")
  id: ID!
  platform_name: String
}

type Publisher {
  game_publisher: [Game_publisher]
    @materializer(query: "game_publisherUsingGame_publisher_publisher_id_fkey")
  id: ID!
  publisher_name: String
}

type Region {
  id: ID!
  region_name: String
  region_sales: [Region_sales]
    @materializer(query: "region_salesUsingRegion_sales_region_id_fkey")
}

type Region_sales {
  game_platform: Game_platform
    @materializer(query: "game_platformUsingRegion_sales_game_platform_id_fkey")
  game_platform_id: ID
  num_sales: Float
  region: Region @materializer(query: "regionUsingRegion_sales_region_id_fkey")
  region_id: ID
}

input StringFilter {
  eq: String
  ne: String
  like: String
  ilike: String
}

input IDFilter {
  eq: ID
  ne: ID
  gt: ID
  lt: ID
}

input FloatFilter {
  eq: Float
  ne: Float
  gt: Float
  lt: Float
}

input GameFilter {
  id: IDFilter
  game_name: StringFilter
  genre_id: IDFilter
}

input Game_platformFilter {
  id: IDFilter
  game_publisher_id: IDFilter

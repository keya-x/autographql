scalar DateTime

type Class {
  class_code: String
  class_room: String
  class_section: String
  class_time: String
  course: Course @materializer(query: "course")
  crs_code: String
  employee: Employee @materializer(query: "employee")
  enroll: [Enroll] @materializer(query: "enroll")
  prof_num: Int
}

type Course {
  class: [Class] @materializer(query: "classUsingClass_crs_code_fkey")
  crs_code: String
  crs_credit: Float
  crs_description: String
  department: Department @materializer(query: "department")
  dept_code: String
}

type Department {
  course: [Course] @materializer(query: "courseUsingCourse_dept_code_fkey")
  dept_address: String
  dept_code: String
  dept_extension: String
  dept_name: String
  emp_num: Int
  employee: Employee
    @materializer(query: "employeeUsingDepartment_emp_num_fkey")
  professor: [Professor]
    @materializer(query: "professorUsingProfessor_dept_code_fkey")
  school_code: String
}

type Employee {
  class: [Class] @materializer(query: "classUsingClass_prof_num_fkey")
  department: [Department]
    @materializer(query: "departmentUsingDepartment_emp_num_fkey")
  emp_dob: DateTime
  emp_fname: String
  emp_hiredate: DateTime
  emp_initial: String
  emp_jobcode: String
  emp_lname: String
  emp_num: Int
  professor: [Professor] @materializer(query: "professor")
}

type Enroll {
  class: Class @materializer(query: "class")
  class_code: String
  enroll_grade: String
  stu_num: Int
  student: Student @materializer(query: "student")
}

type Professor {
  department: Department
    @materializer(query: "departmentUsingProfessor_dept_code_fkey")
  dept_code: String
  emp_num: Int
  employee: Employee @materializer(query: "employeeUsingProfessor_emp_num_fkey")
  prof_extension: String
  prof_high_degree: String
  prof_office: String
}

type Student {
  dept_code: String
  enroll: [Enroll] @materializer(query: "enrollUsingEnroll_stu_num_fkey")
  prof_num: Int
  stu_class: String
  stu_dob: DateTime
  stu_fname: String
  stu_gpa: Float
  stu_hrs: Int
  stu_init: String
  stu_lname: String
  stu_num: Int
  stu_phone: String
  stu_transfer: Float
}


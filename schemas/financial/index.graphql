scalar Date

type Account {
  account_id: ID!
  date: Date
  disp: [Disp] @materializer(query: "dispUsingDisp_account_id_fkey")
  district: District
    @materializer(query: "districtUsingAccount_district_id_fkey")
  district_id: ID
  frequency: String
  loan: [Loan] @materializer(query: "loanUsingLoan_account_id_fkey")
  order: [Order] @materializer(query: "orderUsingOrder_account_id_fkey")
  trans: [Trans] @materializer(query: "transUsingTrans_account_id_fkey")
}

type Card {
  card_id: ID!
  disp: Disp @materializer(query: "dispUsingCard_disp_id_fkey")
  disp_id: ID
  issued: Date
  type: String
}

type Client {
  birth_date: Date
  client_id: ID!
  disp: [Disp] @materializer(query: "dispUsingDisp_client_id_fkey")
  district: District
    @materializer(query: "districtUsingClient_district_id_fkey")
  district_id: ID
  gender: String
}

type Disp {
  account: Account @materializer(query: "accountUsingDisp_account_id_fkey")
  account_id: ID
  card: [Card] @materializer(query: "cardUsingCard_disp_id_fkey")
  client: Client @materializer(query: "clientUsingDisp_client_id_fkey")
  client_id: ID
  disp_id: ID!
  type: String
}

type District {
  a10: Float
  a11: ID
  a12: Float
  a13: Float
  a14: ID
  a15: ID
  a16: ID
  a2: String
  a3: String
  a4: String
  a5: String
  a6: String
  a7: String
  a8: ID
  a9: ID
  account: [Account]
    @materializer(query: "accountUsingAccount_district_id_fkey")
  client: [Client] @materializer(query: "clientUsingClient_district_id_fkey")
  district_id: ID!
}

type Loan {
  account: Account @materializer(query: "accountUsingLoan_account_id_fkey")
  account_id: ID
  amount: ID
  date: Date
  duration: ID
  loan_id: ID!
  payments: Float
  status: String
}

type Order {
  account: Account @materializer(query: "accountUsingOrder_account_id_fkey")
  account_id: ID
  account_to: ID
  amount: Float
  bank_to: String
  k_symbol: String
  order_id: ID!
}

type Trans {
  account: ID
  accountUsingTrans_account_id_fkey: Account
    @materializer(query: "accountUsingTrans_account_id_fkey")
  account_id: ID
  amount: ID
  balance: ID
  bank: String
  date: Date
  k_symbol: String
  operation: String
  trans_id: ID!
  type: String
}


}

type Assets {
  asset_id: ID!
  other_details: String
}

type Assets_in_events {
  asset_id: ID!
  event_id: ID!
  eventsUsingAssets_in_events_event_id_fkey: Events
    @materializer(query: "eventsUsingAssets_in_events_event_id_fkey")
  eventsUsingAssets_in_events_event_id_fkey1: Events
    @materializer(query: "eventsUsingAssets_in_events_event_id_fkey1")
}

type Channels {
  channel_id: ID!
  other_details: String
}

type Events {
  address_id: ID
  addresses: Addresses
    @materializer(query: "addressesUsingEvents_address_id_fkey")
  agreements: [Agreements]
    @materializer(query: "agreementsUsingAgreements_event_id_fkey")
  assets_in_eventsUsingAssets_in_events_event_id_fkey: [Assets_in_events]
    @materializer(query: "assets_in_eventsUsingAssets_in_events_event_id_fkey")
  assets_in_eventsUsingAssets_in_events_event_id_fkey1: [Assets_in_events]
    @materializer(query: "assets_in_eventsUsingAssets_in_events_event_id_fkey1")
  channel_id: ID
  event_id: ID!
  event_type_code: String
  finance_id: ID
  finances: Finances @materializer(query: "financesUsingEvents_finance_id_fkey")
  location_id: ID
  locations: Locations
    @materializer(query: "locationsUsingEvents_location_id_fkey")
  parties_in_events: [Parties_in_events]
    @materializer(
      query: "parties_in_eventsUsingParties_in_events_event_id_fkey"
    )
  products_in_events: [Products_in_events]
    @materializer(
      query: "products_in_eventsUsingProducts_in_events_event_id_fkey"
    )
}

type Finances {
  events: [Events] @materializer(query: "eventsUsingEvents_finance_id_fkey")
  finance_id: ID!
  other_details: String
}

type Locations {
  events: [Events] @materializer(query: "eventsUsingEvents_location_id_fkey")
  location_id: ID!
  other_details: String
}

type Parties {
  parties_in_events: [Parties_in_events]
    @materializer(
      query: "parties_in_eventsUsingParties_in_events_party_id_fkey"
    )
  party_details: String
  party_id: ID!
}

type Parties_in_events {
  event_id: ID!
  events: Events
    @materializer(query: "eventsUsingParties_in_events_event_id_fkey")
  parties: Parties
    @materializer(query: "partiesUsingParties_in_events_party_id_fkey")
  party_id: ID!
  role_code: String
}

type Products {
  product_id: ID!
  product_name: String
  product_price: Float
  product_type_code: String
  products_in_events: [Products_in_events]
    @materializer(
      query: "products_in_eventsUsingProducts_in_events_product_id_fkey"
    )
}

type Products_in_events {
  event_id: ID
  events: Events
    @materializer(query: "eventsUsingProducts_in_events_event_id_fkey")
  product_id: ID
  product_in_event_id: ID!
  products: Products
    @materializer(query: "productsUsingProducts_in_events_product_id_fkey")
}


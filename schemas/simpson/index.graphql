type Award {
  award: String
  award_category: String
  award_id: ID!
  character_award: [Character_award] @materializer(query: "character_award")
  episode: Episode @materializer(query: "episodeUsingAward_episode_id_fkey")
  episode_id: String
  organization: String
  person: String
  result: String
  role: String
  season: String
  song: String
  year: ID
}

type Character_award {
  award: Award @materializer(query: "awardUsingCharacter_award_award_id_fkey")
  award_id: ID
  character: String
}

type Credit {
  category: String
  credited: String
  episode: Episode @materializer(query: "episodeUsingCredit_episode_id_fkey")
  episode_id: String
  person: String
  personUsingCredit_person_fkey: Person
    @materializer(query: "personUsingCredit_person_fkey")
  role: String
}

type Episode {
  air_date: String
  award: [Award] @materializer(query: "awardUsingAward_episode_id_fkey")
  credit: [Credit] @materializer(query: "credit")
  episode: ID
  episode_id: String!
  episode_image: String
  keyword: [Keyword] @materializer(query: "keywordUsingKeyword_episode_id_fkey")
  number_in_series: ID
  rating: Float
  season: ID
  summary: String
  title: String
  vote: [Vote] @materializer(query: "vote")
  votes: ID
}

type Keyword {
  episode: Episode @materializer(query: "episodeUsingKeyword_episode_id_fkey")
  episode_id: String!
  keyword: String!
}

type Person {
  birth_country: String
  birth_name: String
  birth_place: String
  birth_region: String
  birthdate: String
  credit: [Credit] @materializer(query: "creditUsingCredit_person_fkey")
  height_meters: Float
  name: String!
  nickname: String
}

type Vote {
  episode: Episode @materializer(query: "episodeUsingVote_episode_id_fkey")
  episode_id: String
  percent: Float
  stars: ID
  votes: ID
}

input StringFilter {
  eq: String
  ne: String
  like: String
  ilike: String
}

input IDFilter {
  eq: ID
  ne: ID
  gt: ID
  lt: ID
}

input FloatFilter {
  eq: Float
  ne: Float
  gt: Float
  lt: Float
}

input AwardFilter {
  award_id: IDFilter
  award: StringFilter
  award_category: StringFilter
  episode_id: StringFilter
  organization: StringFilter
  person: StringFilter
  result: StringFilter
  role: StringFilter
  season: StringFilter
  song: StringFilter
  year: IDFilter
}

input Character_awardFilter {
  award_id: IDFilter
  character: StringFilter
}

input CreditFilter {
  category: StringFilter
  credited: StringFilter
  episode_id: StringFilter
  person: StringFilter
  role: StringFilter
}

input EpisodeFilter {
  episode_id: StringFilter
  episode: IDFilter
  air_date: StringFilter
  number_in_series: IDFilter
  rating: FloatFilter
  season: IDFilter
  summary: StringFilter
  title: StringFilter
  votes: IDFilter
}

input KeywordFilter {
  episode_id: StringFilter
  keyword: StringFilter
}

input PersonFilter {
  name: StringFilter
  birth_country: StringFilter
  birth_name: StringFilter
  birth_place: StringFilter
  birth_region: StringFilter
  birthdate: StringFilter
  height_meters: FloatFilter
  nickname: StringFilter
}

input VoteFilter {
  episode_id: StringFilter
  percent: FloatFilter
  stars: IDFilter
  votes: IDFilter
}


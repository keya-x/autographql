type City {
  area: Float
  city_id: ID!
  city_name: String
  population: ID
  shipment: [Shipment]
    @materializer(query: "shipmentUsingShipment_city_id_fkey")
  state: String
}

type Customer {
  address: String
  annual_revenue: ID
  city: String
  cust_id: ID!
  cust_name: String
  cust_type: String
  phone: String
  shipment: [Shipment]
    @materializer(query: "shipmentUsingShipment_cust_id_fkey")
  state: String
  zip: Float
}

type Driver {
  address: String
  city: String
  driver_id: ID!
  first_name: String
  last_name: String
  phone: String
  shipment: [Shipment]
    @materializer(query: "shipmentUsingShipment_driver_id_fkey")
  state: String
  zip_code: ID
}

type Shipment {
  city: City @materializer(query: "cityUsingShipment_city_id_fkey")
  city_id: ID
  cust_id: ID
  customer: Customer @materializer(query: "customerUsingShipment_cust_id_fkey")
  driver: Driver @materializer(query: "driverUsingShipment_driver_id_fkey")
  driver_id: ID
  ship_date: String
  ship_id: ID!
  truck: Truck @materializer(query: "truckUsingShipment_truck_id_fkey")
  truck_id: ID
  weight: Float
}

type Truck {
  make: String
  model_year: ID
  shipment: [Shipment]
    @materializer(query: "shipmentUsingShipment_truck_id_fkey")
  truck_id: ID!
}

input StringFilter {
  eq: String
  ne: String
  like: String
  ilike: String
}

input IDFilter {
  eq: ID
  ne: ID
}

input FloatFilter {
  eq: Float
  ne: Float
  gt: Float
  lt: Float
}

input CityFilter {
  city_id: IDFilter
  city_name: StringFilter
  state: StringFilter
  population: IDFilter
  area: FloatFilter
}

input CustomerFilter {
  cust_id: IDFilter
  cust_name: StringFilter
  cust_type: StringFilter
  address: StringFilter
  city: StringFilter
  state: StringFilter
  phone: StringFilter
  zip: FloatFilter
  annual_revenue: IDFilter
}

input DriverFilter {
  driver_id: IDFilter
  first_name: StringFilter
  last_name: StringFilter
  address: StringFilter
  city: StringFilter
  state: StringFilter
  phone: StringFilter
  zip_code: IDFilter
}

input ShipmentFilter {
  ship_id: IDFilter
  city_id: IDFilter
  cust_id: IDFilter
  driver_id: IDFilter
  truck_id: IDFilter
  ship_date: StringFilter
  weight: FloatFilter
}

input TruckFilter {
  truck_id: IDFilter
  make: StringFilter
  model_year: IDFilter
}


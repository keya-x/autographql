scalar DateTime

type Addresses {
  address_id: ID!
  city: String
  country: String
  line_1: String
  line_2: String
  line_3: String
  other_address_details: String
  state_province_county: String
  student_addresses: [Student_addresses]
    @materializer(query: "student_addresses")
  students: [Students]
    @materializer(query: "studentsUsingStudents_address_id_fkey")
  teachers: [Teachers]
    @materializer(query: "teachersUsingTeachers_address_id_fkey")
  zip_postcode: String
}

type Assessment_notes {
  date_of_notes: DateTime
  notes_id: ID
  other_details: String
  student_id: ID
  students: Students
    @materializer(query: "studentsUsingAssessment_notes_student_id_fkey")
  teacher_id: ID
  teachers: Teachers
    @materializer(query: "teachersUsingAssessment_notes_teacher_id_fkey")
  text_of_notes: String
}

type Behavior_incident {
  date_incident_end: DateTime
  date_incident_start: DateTime
  incident_id: ID!
  incident_summary: String
  incident_type_code: String
  other_details: String
  recommendations: String
  ref_incident_type: Ref_incident_type
    @materializer(
      query: "ref_incident_typeUsingBehavior_incident_incident_type_code_fkey"
    )
  student_id: ID
  students: Students
    @materializer(query: "studentsUsingBehavior_incident_student_id_fkey")
  students_in_detention: [Students_in_detention]
    @materializer(
      query: "students_in_detentionUsingStudents_in_detention_incident_id_fkey"
    )
}

type Detention {
  datetime_detention_end: DateTime
  datetime_detention_start: DateTime
  detention_id: ID!
  detention_summary: String
  detention_type_code: String
  other_details: String

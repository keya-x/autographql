  date_first_rental: DateTime
  date_left_university: DateTime
  email_address: String
  first_name: String
  last_name: String
  middle_name: String
  other_student_details: String
  student_addresses: [Student_addresses]
    @materializer(
      query: "student_addressesUsingStudent_addresses_student_id_fkey"
    )
  student_id: ID!
  students_in_detention: [Students_in_detention]
    @materializer(
      query: "students_in_detentionUsingStudents_in_detention_student_id_fkey"
    )
}

type Students_in_detention {
  behavior_incident: Behavior_incident
    @materializer(
      query: "behavior_incidentUsingStudents_in_detention_incident_id_fkey"
    )
  detention: Detention
    @materializer(
      query: "detentionUsingStudents_in_detention_detention_id_fkey"
    )
  detention_id: ID
  incident_id: ID
  student_id: ID
  students: Students
    @materializer(query: "studentsUsingStudents_in_detention_student_id_fkey")
}

type Teachers {
  address_id: ID
  addresses: Addresses
    @materializer(query: "addressesUsingTeachers_address_id_fkey")

}

type Student_addresses {
  address_id: ID
  addresses: Addresses
    @materializer(query: "addressesUsingStudent_addresses_address_id_fkey")
  date_address_from: DateTime
  date_address_to: DateTime
  monthly_rental: Float
  other_details: String
  student_id: ID
  students: Students
    @materializer(query: "studentsUsingStudent_addresses_student_id_fkey")
}

type Students {
  address_id: ID
  addresses: Addresses
    @materializer(query: "addressesUsingStudents_address_id_fkey")

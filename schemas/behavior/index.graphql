    @materializer(query: "students_in_detention")
  teacher_id: ID
  teachers: Teachers
    @materializer(query: "teachersUsingDetention_teacher_id_fkey")
}

type Ref_address_types {
  address_type_code: String!
  address_type_description: String
}

type Ref_detention_type {

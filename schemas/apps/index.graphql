    @dbquery(
      type: "postgresql"
      schema: "public"
      table: "user_reviews"
      configuration: "postgresql_config"
    )
  user_reviewsPaginatedList(first: Int, after: Int): [User_reviews]
    @dbquery(
      type: "postgresql"
      schema: "public"
      query: """
      SELECT "app", "sentiment", "sentiment_polarity", "sentiment_subjectivity", "translated_review" FROM "user_reviews" LIMIT $1 OFFSET $2
      """
      configuration: "postgresql_config"
    )
  playstoreFilterList(filter: PlaystoreFilter): [Playstore]
    @dbquery(
      type: "postgresql"
      schema: "public"
      table: "playstore"
      configuration: "postgresql_config"
    )
  user_reviewsFilterList(filter: User_reviewsFilter): [User_reviews]
    @dbquery(
      type: "postgresql"
      schema: "public"
      table: "user_reviews"
      configuration: "postgresql_config"
    )
}


type Playstore {
  app: String
  category: String
  content_Rating: String
  genres: String
  installs: String
  price: String
  rating: Float
  reviews: ID
  size: String
  type: String
}

type User_reviews {
  app: String
  sentiment: String
  sentiment_polarity: String
  sentiment_subjectivity: String
  translated_review: String
}

input StringFilter {
  eq: String
  ne: String
  like: String
  ilike: String
}

input FloatFilter {
  eq: Float
  ne: Float
  gt: Float
  lt: Float
}

input IDFilter {
  eq: ID
  ne: ID
  gt: ID
  lt: ID
}

input PlaystoreFilter {
  app: StringFilter
  category: StringFilter
  content_Rating: StringFilter
  genres: StringFilter
  installs: StringFilter
  price: StringFilter
  rating: FloatFilter
  reviews: IDFilter
  size: StringFilter
  type: StringFilter
}

input User_reviewsFilter {
  app: StringFilter
  sentiment: StringFilter
  sentiment_polarity: StringFilter
  sentiment_subjectivity: StringFilter
  translated_review: StringFilter
}


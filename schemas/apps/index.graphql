type Query {
  " Queries for type 'Playstore' "
  playstorePaginatedList(first: Int, after: Int): [Playstore]
    @dbquery(
      type: "postgresql"
      schema: "public"
      query: """
      SELECT "app", "category", "Content Rating" as "content_Rating", "genres", "installs", "price", "rating", "reviews", "size", "type" FROM "playstore" LIMIT $1 OFFSET $2
      """
      configuration: "postgresql_config"
    )
  " Queries for type 'User_reviews' "

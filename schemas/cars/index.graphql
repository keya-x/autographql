type Country {
  country: String
  origin: ID!
  production: [Production]
    @materializer(query: "productionUsingProduction_country_fkey")
}

type Data {
  acceleration: Float
  car_name: String
  cylinders: ID
  displacement: Float
  horsepower: ID
  id: ID!
  model: ID
  mpg: Float
  price: Price @materializer(query: "priceUsingData_id_fkey")
  production: [Production]
    @materializer(query: "productionUsingProduction_id_fkey1")
  weight: ID
}

type Price {
  data: Data @materializer(query: "dataUsingData_id_fkey")
  id: ID!
  price: Float
  production: [Production]
    @materializer(query: "productionUsingProduction_id_fkey")
}

type Production {
  country: ID
  countryUsingProduction_country_fkey: Country
    @materializer(query: "countryUsingProduction_country_fkey")
  data: Data @materializer(query: "dataUsingProduction_id_fkey1")
  id: ID!
  model_year: ID!
  price: Price @materializer(query: "priceUsingProduction_id_fkey")
}

input IntFilter {
  eq: Int
  ne: Int
  gt: Int
  lt: Int

}

input FloatFilter {
  eq: Float
  ne: Float
  gt: Float
  lt: Float

}

input StringFilter {
  eq: String
  ne: String
  like: String
  ilike: String
}

input IDFilter {
  eq: ID
  ne: ID
  gt: ID
  lt: ID
}

input DataFilter {
  id: IDFilter
  car_name: StringFilter
  mpg: FloatFilter
  cylinders: IDFilter
  displacement: FloatFilter
  horsepower: IDFilter
  weight: IDFilter
  acceleration: FloatFilter
  model: IDFilter
}

input PriceFilter {
  id: IDFilter
  price: FloatFilter
}

input ProductionFilter {
  id: IDFilter
  model_year: IDFilter
  country: IDFilter
}


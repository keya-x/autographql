type City {
  city_name: String!
  country_name: String
  population: ID
  state: State @materializer(query: "stateUsingCity_state_name_fkey")
  state_name: String!
}

type Highlow {
  highest_elevation: String
  highest_point: String
  lowest_elevation: String
  lowest_point: String
  state: State @materializer(query: "stateUsingHighlow_state_name_fkey")
  state_name: String!
}

type Lake {
  area: Float
  country_name: String
  lake_name: String
  state_name: String
}

type Mountain {
  country_name: String
  mountain_altitude: ID
  mountain_name: String!
  state: State @materializer(query: "stateUsingMountain_state_name_fkey")
  state_name: String!
}

type River {
  country_name: String
  length: ID
  river_name: String!
  state: State @materializer(query: "stateUsingRiver_traverse_fkey")
  traverse: String
}

type State {
  area: Float
  capital: String
  city: [City] @materializer(query: "cityUsingCity_state_name_fkey")
  country_name: String
  density: Float
  highlow: Highlow @materializer(query: "highlowUsingHighlow_state_name_fkey")
  mountain: [Mountain]
    @materializer(query: "mountainUsingMountain_state_name_fkey")
  population: ID
  river: [River] @materializer(query: "riverUsingRiver_traverse_fkey")
  stateUsingBorder_info_border_fkey: [State]
    @materializer(query: "stateUsingBorder_info_border_fkey")
  stateUsingBorder_info_state_name_fkey: [State]
    @materializer(query: "stateUsingBorder_info_state_name_fkey")
  state_name: String!
}


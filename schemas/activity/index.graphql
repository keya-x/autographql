type Activity {
  actid: ID!
  activity_name: String
  faculty: [Faculty] @materializer(query: "facultyViaFaculty_participates_in")
  student: [Student] @materializer(query: "studentViaParticipates_in")
}

type Faculty {
  activity: [Activity]
    @materializer(query: "activityViaFaculty_participates_in")
  building: String
  facid: ID!
  fname: String
  lname: String
  phone: ID
  rank: String
  room: String
  sex: String
}

type Student {
  activity: [Activity] @materializer(query: "activityViaParticipates_in")
  advisor: ID
  age: ID
  city_code: String
  fname: String
  lname: String
  major: ID
  sex: String
  stuid: ID!
}


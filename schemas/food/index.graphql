scalar Date

type Businesses {
  address: String
  application_date: Date
  business_certificate: ID
  business_id: ID!
  city: String
  inspections: [Inspections] @materializer(query: "inspections")
  latitude: Float
  longitude: Float
  name: String
  owner_address: String
  owner_city: String
  owner_name: String
  owner_state: String
  owner_zip: String
  phone_number: ID
  postal_code: String
  tax_code: String
  violations: [Violations] @materializer(query: "violations")
}

type Inspections {
  business_id: ID
  businesses: Businesses
    @materializer(query: "businessesUsingInspections_business_id_fkey")
  date: Date
  score: ID
  type: String
}

type Violations {
  business_id: ID
  businesses: Businesses
    @materializer(query: "businessesUsingViolations_business_id_fkey")
  date: Date
  description: String
  risk_category: String
  violation_type_id: String
}

input StringFilter {
  eq: String
  ne: String
  like: String
  ilike: String
}

input IDFilter {
  eq: ID
  ne: ID
}

input FloatFilter {
  eq: Float
  ne: Float
  gt: Float
  lt: Float
}

input DateFilter {
  eq: Date
  ne: Date
  gt: Date
  lt: Date
}

input BusinessesFilter {
  business_id: IDFilter
  name: StringFilter
  city: StringFilter
  latitude: FloatFilter
  longitude: FloatFilter
  application_date: DateFilter
  postal_code: StringFilter
  tax_code: StringFilter
}

input InspectionsFilter {
  business_id: IDFilter
  date: DateFilter
  score: IDFilter
  type: StringFilter
}

input ViolationsFilter {
  business_id: IDFilter
  date: DateFilter
  description: StringFilter
  risk_category: StringFilter
  violation_type_id: StringFilter
}


type Container {
  batterypct: ID
  containflag: String
  containmodel: String
  containregistry: String!
  coolkind: String
  coolmass: ID
  coolrefills: ID
  coolremainpct: Float
  datalogger: [Datalogger]
    @materializer(query: "dataloggerUsingDatalogger_containlog_fkey")
  masskg: ID
  pwrbackupflag: String
  pwrfeed: String
  refilllatest: String
  refillnext: String
  sensordata: [Sensordata]
    @materializer(query: "sensordataUsingSensordata_containlink_fkey")
  shipments: Shipments
    @materializer(query: "shipmentsUsingContainer_shipown_fkey")
  shipown: String
  transportinfo: [Transportinfo]
    @materializer(query: "transportinfoUsingTransportinfo_containtransit_fkey")
  volliters: ID
}

type Datalogger {
  batteryswap: String
  commproto: String
  container: Container
    @materializer(query: "containerUsingDatalogger_containlog_fkey")
  containlog: String
  datapct: ID
  datauptime: String
  firmvers: String
  logflag: String
  loggerreg: String!
  loginterval: ID
  memusepct: ID
  netsignal: String
  shiplog: String
  shipments: Shipments
    @materializer(query: "shipmentsUsingDatalogger_shiplog_fkey")
  softupdate: String
  storecapmb: ID
  storeremainmb: ID
  syncflag: String
  syncfreqhr: ID
  syshealth: String
  transmitflag: String
}

type Regulatoryandmaintenance {
  calibdatelast: String
  calibdatenext: String
  calibflag: String
  compscore: ID
  contactemerg: String
  contactno: String
  correctactions: String
  docuflag: String
  incidents: ID
  inspectdatelast: String
  inspectdatenext: String
  inspectoutcome: String
  maintdatelast: String
  maintdatenext: String
  maintflag: String
  preventsteps: String
  regmaintregistry: ID!
  resolveflag: String
  respperson: String
  riskflag: String
  shipgov: String
  shipments: Shipments
    @materializer(query: "shipmentsUsingRegulatoryandmaintenance_shipgov_fkey")
  transportinfo: Transportinfo
    @materializer(
      query: "transportinfoUsingRegulatoryandmaintenance_vehgov_fkey"
    )
  validflag: String
  vehgov: String
  verifymethod: String
}

type Sensordata {
  acceldata: ID
  alertkind: String
  alerts: ID
  alerttime: String
  container: Container
    @materializer(query: "containerUsingSensordata_containlink_fkey")
  containlink: String
  critevents: ID
  handleevents: ID
  humiditypct: Float
  impactflag: String
  lightlux: ID
  presskpa: ID
  sensortrack: ID!
  shockflag: String
  storetempc: ID
  tempdevcount: ID
  tempmaxc: Float
  tempminc: Float
  tempnowc: ID
  tempstabidx: ID
  temptolc: Float
  tiltflag: String
  transportinfo: Transportinfo
    @materializer(query: "transportinfoUsingSensordata_vehsenseref_fkey")
  vehsenseref: String
  vibelvlmms: Float
}

type Shipments {
  container: [Container]
    @materializer(query: "containerUsingContainer_shipown_fkey")
  contamlevel: String
  customsflag: String
  datalogger: [Datalogger]
    @materializer(query: "dataloggerUsingDatalogger_shiplog_fkey")
  exppermitref: String
  generalnote: String
  handlingguide: String
  imppermitref: String
  insureflag: String
  insureref: String
  integritymark: String
  packagestate: String
  qualcheck: String
  regprofile: String
  regulatoryandmaintenance: [Regulatoryandmaintenance]
    @materializer(
      query: "regulatoryandmaintenanceUsingRegulatoryandmaintenance_shipgov_fkey"
    )
  routealign: String
  sealflag: String
  sealref: String
  shipmentregistry: String!
  sterilemark: String
  storagepose: String
  tampersign: String
  timemark: String
  transportinfo: [Transportinfo]
    @materializer(query: "transportinfoUsingTransportinfo_shiptransit_fkey")
}

type Transportinfo {
  altmeter: ID
  carrcert: String
  carrlabel: String
  container: Container
    @materializer(query: "containerUsingTransportinfo_containtransit_fkey")
  containtransit: String
  currentsite: String
  departsite: String
  destsite: String
  distdonekm: Float
  distleftkm: Float
  eta: String
  gpsflag: String
  latvalue: ID
  locupdatemark: String
  locupdatemin: ID
  lonvalue: ID
  regulatoryandmaintenance: [Regulatoryandmaintenance]
    @materializer(
      query: "regulatoryandmaintenanceUsingRegulatoryandmaintenance_vehgov_fkey"
    )
  sensordata: [Sensordata]
    @materializer(query: "sensordataUsingSensordata_vehsenseref_fkey")
  shipments: Shipments
    @materializer(query: "shipmentsUsingTransportinfo_shiptransit_fkey")
  shiptransit: String
  speedkm: ID
  transmode: String
  vehiclekind: String
  vehiclereg: String!
  vehtempc: ID
}

type Vaccinedetails {
